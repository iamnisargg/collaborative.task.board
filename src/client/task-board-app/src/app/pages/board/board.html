<form [formGroup]="newTaskForm" (ngSubmit)="addTask()" class="new-task-form">
  <input type="text" formControlName="title" placeholder="New task title..." />
  <button type="submit">Add Task</button>
</form>

<div class="board">
  @for (column of columns(); track column.id) {
    <div class="column">
      <h3>{{ column.name }}</h3>
      <div
        class="task-list"
        cdkDropList
        [cdkDropListData]="column.tasks"
        [cdkDropListConnectedTo]="columnIds()"
        [id]="column.id"
        (cdkDropListDropped)="drop($event)"
      >
        @for (task of column.tasks; track task.id) {
          <div class="task-card" cdkDrag>
            <span>{{ task.title }}</span>
            <button class="delete-btn" (click)="deleteTask(column.id, task.id)">✕</button>
          </div>
        }
      </div>
    </div>
  }
</div>
